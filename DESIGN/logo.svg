<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-labelledby="title">
  <title id="title">شعار مزايد</title>
  <!-- Background transparent -->
  <!-- Circle badge -->
  <g id="badge">
    <circle cx="90" cy="100" r="70" fill="#FF6B2D" />
    <!-- Gavel head -->
    <rect x="60" y="72" width="60" height="22" rx="4" ry="4" fill="#ffffff" transform="rotate(-25 90 83)" />
    <!-- Gavel handle -->
    <rect x="110" y="100" width="10" height="60" rx="4" ry="4" fill="#ffffff" transform="rotate(-25 115 130)" />
    <!-- Accent circle -->
    <circle cx="140" cy="40" r="6" fill="#FFFFFF" opacity="0.15" />
  </g>

  <!-- Brand text (Arabic) -->
  <g id="wordmark">
    <text x="190" y="110" font-family="Cairo, 'Noto Sans Arabic', sans-serif" font-size="64" fill="#222222">مزايد</text>
    <text x="190" y="150" font-family="Cairo, 'Noto Sans Arabic', sans-serif" font-size="14" fill="#6B6B6B">منصة المزادات والإعلانات الموحدة</text>
  </g>

</svg>
